name: Test Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Resolve BC versions
        id: resolve
        run: |
          BC_PREFIXES=$(cat .github/bc-versions.txt | grep -v '^#' | tr '\n' ' ')
          VERSIONS="[]"
          for prefix in $BC_PREFIXES; do
            FULL=$(dotnet run --project tools/DownloadArtifacts -- resolve-version "$prefix" dummy 2>/dev/null || true)
            if [ -n "$FULL" ]; then
              echo "  $prefix -> $FULL"
              VERSIONS=$(echo "$VERSIONS" | python3 -c "import json,sys; v=json.load(sys.stdin); v.append('$FULL'); print(json.dumps(v))")
            else
              echo "  $prefix -> FAILED (skipping)"
            fi
          done
          echo "matrix={\"bc-version\":$VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "Matrix: $VERSIONS"

  test:
    needs: resolve-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-versions.outputs.matrix) }}
    name: BC ${{ matrix.bc-version }}
    env:
      BC_VERSION: ${{ matrix.bc-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build (auto-downloads BC ${{ matrix.bc-version }} DLLs)
        run: |
          dotnet build AlRunner.slnx -p:_BCVersion=${{ matrix.bc-version }} -c Release

      - name: Run al-language corpus
        id: al-language
        run: |
          # The canonical corpus lives in the tests/al-language submodule.
          # See docs/expectations.md for how OOS-by-design tests are declared.
          rc=0
          start=$SECONDS
          dotnet run --no-build --project AlRunner -c Release -- \
              tests/al-language/tests/al-language \
              --out al-language-results.json || rc=$?
          elapsed=$(( SECONDS - start ))
          if [ "$rc" -ne 0 ]; then
            echo "::error::al-language run exited with code $rc"
            exit "$rc"
          fi
          echo "elapsed=${elapsed}s" >> "$GITHUB_OUTPUT"

      - name: Run runner-extras (if present)
        if: ${{ hashFiles('tests/runner-extras/**/*.al') != '' }}
        run: |
          dotnet run --no-build --project AlRunner -c Release -- \
              tests/runner-extras \
              --out runner-extras-results.json

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.bc-version }}
          path: |
            al-language-results.json
            runner-extras-results.json
          if-no-files-found: ignore

  all-tests:
    name: All BC versions passed
    needs: [resolve-versions, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all matrix jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more BC version test jobs failed (result: ${{ needs.test.result }})"
            exit 1
          fi
          echo "All BC versions passed."
